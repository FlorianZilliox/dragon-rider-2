<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dragon Rider</title>
<style>
  /* Un seul monde visuel : un crépuscule gothique en 16 bits. Pas de variante claire/sombre. */
  [hidden] { display: none !important; }
  :root {
    --fond: #070707;
    --croix: #1d1d1d;
    --croix-creux: #131313;
    --sang: #8e2230;
    --bronze: #7d7d7d;
    --panneau: #232323;
    --panneau-ombre: #181818;
    --etiquette: #818181;
    --b: clamp(44px, 8vmin, 60px);
  }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--fond);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    font-family: ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
  }
  #jeu {
    position: fixed; inset: 0; touch-action: none; background: var(--fond);
    display: flex; align-items: center; justify-content: center;
  }
  #jeu.portrait { flex-direction: column; justify-content: flex-start; padding-top: env(safe-area-inset-top, 0px); }
  #ecran { display: block; flex: none; image-rendering: pixelated; image-rendering: crisp-edges; }

  .manette {
    position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none;
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(16px, env(safe-area-inset-left, 0px));
  }
  #jeu.paysage .manette { opacity: .72; }
  #jeu.portrait .manette {
    position: relative; flex: 1; align-items: center; width: 100%; box-sizing: border-box;
    background: linear-gradient(var(--panneau), var(--panneau-ombre));
    border-top: 3px solid #373737; padding-top: 10px;
  }
  .croix {
    pointer-events: auto; display: grid;
    grid-template-columns: repeat(3, var(--b)); grid-template-rows: repeat(3, var(--b));
    grid-template-areas: ". haut ." "gauche moyeu droite" ". bas .";
    filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .45));
  }
  .croix button, .moyeu { background: var(--croix); border: 0; padding: 0; }
  .croix button {
    -webkit-tap-highlight-color: transparent; touch-action: none; cursor: pointer;
    color: #6a6a6a; display: grid; place-items: center;
  }
  .croix button svg { width: 38%; height: 38%; fill: currentColor; }
  .croix button.on { background: var(--croix-creux); color: #adadad; }
  #btn-haut { grid-area: haut; border-radius: 7px 7px 0 0; }
  #btn-bas { grid-area: bas; border-radius: 0 0 7px 7px; }
  #btn-gauche { grid-area: gauche; border-radius: 7px 0 0 7px; }
  #btn-droite { grid-area: droite; border-radius: 0 7px 7px 0; }
  .moyeu { grid-area: moyeu; display: grid; place-items: center; }
  .moyeu::after { content: ""; width: 42%; height: 42%; border-radius: 50%; background: var(--croix-creux); }

  .actions { pointer-events: auto; display: flex; gap: 14px; align-items: flex-start; }
  .action { display: grid; justify-items: center; gap: 5px; }
  .action:first-child { margin-top: calc(var(--b) * .55); }
  .rond {
    -webkit-tap-highlight-color: transparent; touch-action: none; cursor: pointer;
    width: calc(var(--b) * 1.3); height: calc(var(--b) * 1.3); border-radius: 50%; border: 0; padding: 0;
    font-family: inherit; font-weight: 800; font-size: calc(var(--b) * .38); line-height: 1;
    box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .28), 0 3px 0 rgba(0, 0, 0, .5);
    transition: transform .06s;
  }
  .rond.on { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .28), 0 1px 0 rgba(0, 0, 0, .5); }
  #btn-ruee { background: var(--bronze); color: #1c1c1c; }
  #btn-feu { background: var(--sang); color: #e7e7e7; }
  .action span { font-size: 11px; font-weight: 800; letter-spacing: .12em; color: #c7c7c7; text-shadow: 0 1px 0 #000; }
  #jeu.portrait .action span { color: var(--etiquette); text-shadow: none; }
  button:focus-visible { outline: 2px solid #d1d1d1; outline-offset: 2px; }
</style>

<div id="jeu" class="paysage">
  <canvas id="ecran" aria-label="Dragon Rider : un dragonnier traverse un monde éteint, des terres décharnées jusqu'aux cryptes"></canvas>
  <div class="manette">
    <div class="croix" aria-label="Croix directionnelle">
      <button type="button" id="btn-haut" data-k="up" aria-label="Monter"><svg viewBox="0 0 10 10"><path d="M5 1 9.5 8h-9z"/></svg></button>
      <button type="button" id="btn-gauche" data-k="left" aria-label="Gauche"><svg viewBox="0 0 10 10"><path d="M1 5 8 .5v9z"/></svg></button>
      <div class="moyeu"></div>
      <button type="button" id="btn-droite" data-k="right" aria-label="Droite"><svg viewBox="0 0 10 10"><path d="M9 5 2 .5v9z"/></svg></button>
      <button type="button" id="btn-bas" data-k="down" aria-label="Descendre"><svg viewBox="0 0 10 10"><path d="M5 9 9.5 2h-9z"/></svg></button>
    </div>
    <div class="actions">
      <div class="action"><button type="button" class="rond" id="btn-ruee" data-k="ruee" aria-label="Ruée (touche C)">C</button><span>RUÉE</span></div>
      <div class="action"><button type="button" class="rond" id="btn-feu" data-k="fire" aria-label="Feu (touche X ou Espace)">X</button><span>FEU</span></div>
    </div>
  </div>
</div>

    for (let ty = Math.floor((sol - CORPS_SOL) / TP); ty < sol / TP; ty++)

  function solSous(x, y) {

  // ---------- terrain et objets : textures et objets peints par Pixel Artist (art/recettes/terrain.json, objets.json) ----------
  // roc : texture raccordable (128 px), crete : bordure posée sur les sols, dessous : roche qui pend sous les îles
  const TERRAIN = [
    { roc: 'terrain/roc-terres', crete: 'terrain/crete-terres', dessous: 'terrain/dessous' },
    { roc: 'terrain/roc-cimetiere', crete: 'terrain/crete-cimetiere', dessous: 'terrain/dessous' },

  const effile = (bord, mini, maxi, x) => Math.min(maxi, Math.round(mini + (maxi - mini) * Math.min(1, bord / 44) ** 0.55 + (hash(x * 1.7) - 0.5) * 5));
  function ligneOpaque(img) {             // première ligne presque pleine : là où la crête rejoint le sol
    const c = toile(img.width, img.height), g = c.getContext('2d');

  function construireTuiles() {

    g.fillStyle = '#9a9a96';

  function construireAccessoires() {

  function dessinerTuiles() {

    const ty0 = Math.max(0, Math.floor(camY / TP) - 5), ty1 = Math.min(NIV.h - 1, Math.floor((camY + H) / TP) + 2);
    // 1. la roche qui pend sous les îles (derrière la roche elle-même) : pleine profondeur au milieu,
    //    elle s'effile vers les bords de chaque île au lieu d'être coupée net
    if (T.dessous) {

      for (let ty = ty0; ty <= ty1; ty++) {
        let tx = Math.max(0, tx0 - 12);
        while (tx <= Math.min(NIV.l - 1, tx1 + 12)) {
          if (!pend(tx, ty)) { tx++; continue; }

          const X0 = tx * TP, X1 = (fin + 1) * TP, y = ty * TP + TP - 4;
          for (let x = Math.max(X0, Math.floor(cam) - 1); x < Math.min(X1, cam + W + 1); x++) {
            const h = effile(Math.min(x - X0, X1 - 1 - x), 3, d.height, x);
            ctx.drawImage(d, mod(x, d.width), 0, 1, h, x, y, 1, h);

          tx = fin + 1;
        }
      }
    }
    // 2. la roche, les corniches (passerelles d'aqueduc), les pointes
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
      const t = caseA(tx, ty), x = tx * TP, y = ty * TP;
      if (t === ROC || t === FRAGILE) {
        ctx.drawImage(T.roc, mod(x, T.roc.width), mod(y, T.roc.height), TP, TP, x, y, TP, TP);
        if (t === FRAGILE) ctx.drawImage(T.fissures, x, y);
        ctx.fillStyle = '#060606';
        if (!plein(tx - 1, ty)) ctx.fillRect(x, y, 1, TP);
        if (!plein(tx + 1, ty)) ctx.fillRect(x + TP - 1, y, 1, TP);
        if (!plein(tx, ty + 1) && ty < NIV.h - 1) ctx.fillRect(x, y + TP - 1, TP, 1);

      } else if (t === PICS) {

    }
    // 3. les passerelles d'aqueduc (corniches) : le tablier d'un bout à l'autre, les arches s'effilent vers les extrémités
    const p = T.passerelle, haut = T.tablier, tablier = 10;   // haut : où commence le tablier dans la bande (au-dessus : pinacles)
    for (let ty = ty0; ty <= ty1; ty++) {

  function dessinerCourants() {           // colonnes de cendre qui montent : on voit où le vent porte

  function dessinerObjets() {

  // ================= État du jeu =================
  let etat = 'titre', P = null, ennemis = [], boules = [], orbes = [], coeurs = [], particules = [], popups = [], ombres = [];
  let cam = 0, camY = 0, temps = 0, score = 0, record = 0, combo = 0, dernierKill = -9, secousse = 0, gel = 0, finT = 0, tenuBas = false;

  try { record = +localStorage.getItem('dragon-rider-record') || 0; } catch {}

  function joueurNeuf(x, sol) {
    return {
      x, y: sol - G + AN.land.bodyY[AN.land.frames - 1], sol, vx: 0, vy: 0, face: 1, fs: 1, mode: 'ground', at: 0,
      ph: 0, cad: 1.15, amp: 1, plane: 0, replie: 0, haut: 0, pitch: 0, pitchV: 0, queue: 0, queueV: 0, bob: 0,
      croisiere: 0, atk: -1, tire: false, cd: 0, recul: 0, mal: -1, inv: 0, flash: 0, pv: PV_MAX,

  // entrer dans un niveau : neuf, ou repris à l'autel (reliques prises, murs brisés et ennemis vaincus le restent)

  function majCarte(dt) {
    if (!carte) return;

      carte.bascule = true;
      const pv = Math.min(PV_MAX, P.pv + 2);

  function voileCarte(c) {

  function popup(txt, x, y, teinte = OS, k = 1) { popups.push({ txt, x, y, teinte, k, vie: 1.1 }); }

  // ---------- battement d'ailes (même profil que outils/animer_ailes.py) ----------
  function profilAile(ph) {

  }

    s = M + p.amp * (s - M); sx = 1 + p.amp * (sx - 1); rot *= p.amp;
    s = mix(s, 0.5, p.plane); sx = mix(sx, 1.03, p.plane); rot = mix(rot, -4, p.plane);      // plané : ailes tendues

  }

  // ---------- actions du dragon ----------

  function cracher() {
    const vole = P.mode === 'air' || P.mode === 'fall';
    const p = vole ? P.pitch : 0, c = Math.cos(p), s = Math.sin(p);
    const mx = BOUCHE.x, my = BOUCHE.y + (vole ? P.bob : 0);
    const bx = P.x + P.face * (mx * c - my * s), by = P.y + (mx * s + my * c);
    P.recul = 1; sfx('feu');
    // collé à un mur, la gueule dépasse de l'autre côté : le feu part du corps et s'arrête à la première pierre
    for (let k = 0; k <= 1; k += 1 / 16) {
      const x = mix(P.x, bx, k), y = mix(P.y, by, k), tx = Math.floor(x / TP), ty = Math.floor(y / TP), t = caseA(tx, ty);

    for (let i = 0; i < 10; i++) particule({ x: bx, y: by, vx: P.face * rand(40, 200), vy: rand(-60, 60), vie: rand(0.15, 0.3), max: 0.3, t: 1 });

  function demarrerRuee(versLeBas) {
    const depuisLeSol = auSol();

  function blesser(depuisX) {

  // ---------- mise à jour du dragon ----------
  function tomber() {                    // le sol s'arrête : le dragon ouvre les ailes et reprend l'air
    P.mode = 'air'; P.at = 0; P.y = P.sol - BAS - 1; P.vy = 30; P.ph = 0.2; P.amp = 1; P.cad = 1.6;
    P.pitch = 0.1; P.pitchV = 0; P.replie = 0; P.plane = 0; P.haut = 0; P.croisiere = 0;
  }
  function chuteAbime() {                // tombé dans le gouffre : un cœur en moins, retour au dernier sol sûr
    const mourant = P.mode === 'fall' || P.pv <= 0;

    P.x = x; P.sol = sol; P.vx = 0; P.vy = 0; P.ruee = -1; P.atk = -1; P.mal = -1; P.pitch = 0; P.pitchV = 0; P.at = 0;
    if (etat !== 'jeu') { P.mode = 'ground'; return; }
    if (mourant) { P.mode = 'dead'; return; }
    P.pv--; secousse = 0.3; gel = 0.1; sfx('aie');
    if (P.pv <= 0) { P.mode = 'dead'; sfx('chute'); }

  function majDragon(dt, E) {
    const dir = (E.R ? 1 : 0) - (E.L ? 1 : 0);

    P.recul = Math.max(0, P.recul - dt * 5);

    if (P.atk >= 0) {

        if (P.envol) P.vy = approche(P.vy, -40, dt * 3);
        P.vx = approche(P.vx, libre ? dir * V.AIR : 0, dt * 5);
        if (P.y + BAS > P.sol - 1) {                          // encore au ras du sol : on avance comme à pied
          deplacerSol(P.vx * dt);

        } else if (deplacerVol(P.vx * dt, P.vy * dt).plafond) P.vy = Math.max(0, P.vy);
        if (P.at * FPS.jump >= AN.jump.frames) {
          P.mode = 'air'; P.at = 0; P.ph = 0; P.amp = 1; P.cad = 2.2; P.pitch = -0.22; P.pitchV = 0;
          P.replie = 0; P.plane = 0; P.haut = 0; P.croisiere = 0;

        if (deplacerSol(P.vx * dt)) P.vx = 0;

      case 'fall': {

        break;
      }

    }
    if (P.mode === 'ground' || P.mode === 'land' || P.mode === 'dead') {   // au sol, le corps suit l'image
      const d = posture();
      P.y = P.sol - G + (AN[d.an].grounded ? AN[d.an].bodyY[d.i] : 0);
    }

      const pied = P.mode === 'air' ? P.y + BAS : P.sol, tete = P.mode === 'air' ? P.y - HAUT : P.sol - CORPS_SOL;
      if (toucheCase(PICS, P.x - LARG + 6, tete + 4, P.x + LARG - 6, pied - 1)) {
        blesser(P.x - P.face * 10);
        if (P.pv > 0) {

          P.y = Math.min(P.y, pied - BAS - 4); P.vy = -210;
          P.souffle = Math.max(P.souffle, 0.5);              // de quoi s'extraire des pics, même épuisé
        }
      }
    }
    if (P.y > NIV.hauteur + 40) chuteAbime();

  function ressortQueue(dt, cible) {
    P.queueV += (80 * (cible - P.queue) - 9 * P.queueV) * dt;
    P.queue += P.queueV * dt;
  }
  function majVol(dt, E, dir, libre) {
    let cAmp = 1, cCad = 1.15, cPlane = 0, cReplie = 0;
    const courant = toucheCase(COURANT, P.x - LARG + 8, P.y - HAUT, P.x + LARG - 8, P.y + BAS);
    if (courant) P.souffle = Math.min(1, P.souffle + dt * SOUFFLE.courant);
    if (P.ruee >= 0) {
      P.ruee += dt;
      const u = P.ruee / 0.3, v = V.RUEE * (1 - 0.45 * u * u);
      P.vx = P.rueeDir[0] * v; P.vy = P.rueeDir[1] * v;
      cAmp = 0.1; cCad = 0.6; cReplie = 1;
      if (u >= 1) { P.ruee = -1; P.vx = P.face * V.AIR * 1.1; P.vy *= 0.3; }
    } else {
      // le souffle : voler fatigue ; épuisé, le dragon ne peut que planer vers le bas
      const epuise = P.souffle <= 0 && !courant;
      const pique = libre && E.D, monte = libre && E.U && !epuise;
      P.vx = approche(P.vx, libre ? dir * V.AIR : 0, dt * 4);
      P.vy = approche(P.vy, pique ? V.PIQUE : monte ? -V.VERT : epuise ? SOUFFLE.epuise : 0, dt * (pique ? 2.5 : 5));
      if (etat === 'jeu' && !courant && !arene)                  // face au Veilleur, le combat se livre en vol : le souffle tient
        P.souffle = Math.max(0, P.souffle - dt * (monte ? SOUFFLE.montee : pique ? 0 : SOUFFLE.palier));
      if (P.mal >= 0) cCad = 3.2;
      else if (epuise && !pique) { cAmp = 0.15; cCad = 0.6; cPlane = 1; }
      else if (pique) { cAmp = 0.15; cCad = 0.8; cReplie = clamp((P.vy - 50) / 140, 0, 0.9); }
      else if (monte) cCad = 2.3;
      else if (Math.abs(P.vx) > V.AIR * 0.6) {

      } else P.croisiere = 0;

    const choc = deplacerVol(P.vx * dt, P.vy * dt);

    if (choc.mur && P.ruee >= 0) { P.ruee = -1; P.vx = 0; secousse = Math.max(secousse, 0.08); }
    // arrondi avant de toucher le sol (ailes levées, nez relevé), puis atterrissage

    const arrondi = P.vy > 0 && hauteur < Math.max(18, P.vy * 0.24);

    if (avant > 0.9 && frac(P.ph) < 0.1 && P.amp > 0.6) sfx('battement');

    ressortQueue(dt, P.amp * 0.09 * Math.sin(2 * Math.PI * P.ph - 1.3) + clamp(P.vy / V.VERT, -1.5, 1.8) * 0.1
      + (P.ruee >= 0 ? 0.14 : 0) - P.pitchV * 0.03);
    if (choc.sol !== null) {
      if (P.mal < 0 && P.pv > 0) atterrir(choc.sol);

  }

  // ---------- posture : ce qui décrit l'image du dragon à dessiner ----------
  // en vol : la marionnette, calculée en continu ; au sol : les images du modèle, redessinées par Pixel Artist
  function posture() {
    const unique = (a, t, fps) => Math.min(Math.floor(t * fps), AN[a].frames - 1);
    const cadre = (an, i, y) => ({ type: 'planche', an, i, x: P.x, y, fs: P.fs });
    switch (P.mode) {
      case 'air': case 'fall': {
        const ph = frac(P.ph);
        return { type: 'rig', pose: 'vol', x: P.x, y: P.y, fs: P.fs, pitch: P.pitch, corps: { dx: -P.recul * 3, dy: P.bob },
                 aile: poseAile(P), queue: P.queue, tete: { dx: 0, dy: -0.6 * P.amp * Math.sin(2 * Math.PI * (ph - 0.35)), rot: 0 },
                 teteVariante: P.atk >= 0 ? unique('attack', P.atk, FPS.attack) : -1,
                 cavalier: { dy: 0.7 * P.amp * Math.sin(2 * Math.PI * (ph - 0.05)), rot: P.ruee >= 0 ? 0.3 : clamp(P.vy / V.PIQUE, 0, 1) * 0.2 } };
      }
      case 'jump': { const i = unique('jump', P.at, FPS.jump); return cadre('jump', i, P.y - AN.jump.bodyY[i]); }
      case 'land': return cadre('land', unique('land', P.at, FPS.land), P.sol - G);
      case 'dead': return cadre('dead', unique('dead', P.at, FPS.dead), P.sol - G);
      default:
        if (P.atk >= 0) return cadre('attack', unique('attack', P.atk, FPS.attack), P.sol - G);
        if (P.accroupi > 0.05 && tenuBas) return cadre('jump', 0, P.sol - G);
        if (Math.abs(P.vx) > 12) return cadre('walk', Math.floor(P.pas) % AN.walk.frames, P.sol - G);
        return cadre('land', AN.land.frames - 1, P.sol - G);
    }
  }
  function autour(q, rot, dx = 0, dy = 0) { ctx.translate(q.p[0] + dx, q.p[1] + dy); ctx.rotate(rot); ctx.translate(-q.p[0], -q.p[1]); }
  function transformer(q, d, loin) {
    switch (q.role) {
      case 'aile': {
        const w = d.aile, [qx, qy] = q.a || [q.p[0] - 10, q.p[1]], b = Math.atan2(q.p[1] - qy, q.p[0] - qx);
        ctx.translate(q.p[0], q.p[1]); ctx.rotate(b + w.rot);
        ctx.scale(w.sx * (loin ? LOIN.sx : 1), w.s * (loin ? LOIN.s : 1));
        ctx.rotate(-b); ctx.translate(-q.p[0], -q.p[1]);
        break;
      }
      case 'tete': autour(q, d.tete.rot, Math.round(d.tete.dx), Math.round(d.tete.dy)); break;
      case 'queue': autour(q, d.queue); break;
      case 'cavalier': autour(q, d.cavalier.rot, 0, Math.round(d.cavalier.dy)); break;
    }
  }
  function dessinerPosture(d, jeu) {
    if (d.type === 'planche') {
      ctx.save();
      ctx.translate(Math.round(d.x), Math.round(d.y));
      ctx.scale(largeurDemiTour(d.fs), 1);
      ctx.drawImage(PL[jeu], d.i * FW, AN[d.an].row * FH, FW, FH, -Math.round(AX), -Math.round(AY), FW, FH);
      ctx.restore();
      return;
    }
    const L = PIECES[jeu][d.pose], tete = L.find((q) => q.role === 'tete');
    ctx.save();
    ctx.translate(Math.round(d.x), Math.round(d.y));
    ctx.scale(largeurDemiTour(d.fs), 1);
    if (d.pitch) ctx.rotate(d.pitch);
    ctx.translate(Math.round(d.corps.dx), Math.round(d.corps.dy));
    for (const q of L) if (q.double) {                  // l'aile opposée, plus sombre, derrière tout
      ctx.save(); ctx.translate(LOIN.dx, LOIN.dy); transformer(q, d, true); ctx.drawImage(q.loin, q.o[0], q.o[1]); ctx.restore();
    }
    for (const q of L) {
      ctx.save();
      if (q.parent === 'tete' && tete) transformer(tete, d, false);
      transformer(q, d, false);
      const v = q.role === 'tete' && d.teteVariante >= 0 && q.variantes[d.teteVariante];
      if (v) ctx.drawImage(v.img, v.o[0], v.o[1]);                      // la vraie tête d'attaque, gueule ouverte
      else ctx.drawImage(q.role === 'aile' && d.aile.s < 0 ? q.dessous : q.img, q.o[0], q.o[1]);
      ctx.restore();
    }

  }
  const largeurDemiTour = (fs) => (fs < 0 ? -1 : 1) * (0.3 + 0.7 * Math.abs(fs));
  function dessinerDragon() {
    const d = posture();
    const sol = solSous(P.x, P.y - 4);                       // ombre sur le premier sol en dessous
    if (sol !== null) {
      // un ovale tramé, dense au centre, qui pâlit et rétrécit quand le dragon s'élève ; il ne se pose que sur
      // le sol qui le porte, à cette hauteur : il s'arrête net au bord du vide ou d'un mur
      const haut = clamp((sol - P.y - G) / 160, 0, 1), rx = Math.round(40 * (1 - haut * 0.55)), ry = Math.max(2, Math.round(rx * 0.07));
      const cx = Math.round(P.x + P.fs * 6), ty = sol / TP, force = 1.15 * (1 - haut * 0.7);
      const porte = (tx) => { const t = caseA(tx, ty); return (bloque(t) || t === CORNICHE) && !bloque(caseA(tx, ty - 1)); };
      ctx.fillStyle = '#050505';
      for (let dy = -ry; dy <= ry; dy++) for (let dx = -rx; dx <= rx; dx++) {
        const d = (dx / rx) ** 2 + (dy / ry) ** 2, x = cx + dx, y = sol + dy;
        if (d >= 1 || (1 - d) * force <= (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16 || !porte(Math.floor(x / TP))) continue;
        ctx.fillRect(x, y, 1, 1);
      }
    }
    for (const o of ombres) { ctx.globalAlpha = 0.5 * o.vie / 0.2; dessinerPosture(o.d, 'fantome'); }
    ctx.globalAlpha = 1;
    const clignote = P.inv > 0 && P.pv > 0 && P.ruee < 0 && P.mal < 0 && Math.floor(temps * 30) % 2;
    if (clignote) return;
    if (P.flash > 0) { dessinerPosture(d, 'blanc'); return; }
    // liseré clair : le dragon noir reste lisible sur la nuit
    for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) { ctx.save(); ctx.translate(dx, dy); dessinerPosture(d, 'contour'); ctx.restore(); }
    dessinerPosture(d, 'normal');
    if (reperes) {
      ctx.fillStyle = '#ff3b3b';
      ctx.fillRect(Math.round(P.x) - 4, Math.round(P.y), 9, 1); ctx.fillRect(Math.round(P.x), Math.round(P.y) - 4, 1, 9);
      ctx.strokeStyle = '#3bffb0'; ctx.lineWidth = 1;
      const bas = P.mode === 'air' || P.mode === 'jump' || P.mode === 'fall' ? P.y + BAS : P.sol, haut = P.mode === 'air' || P.mode === 'jump' || P.mode === 'fall' ? P.y - HAUT : P.sol - CORPS_SOL;
      ctx.strokeRect(Math.round(P.x - LARG) + 0.5, Math.round(haut) + 0.5, LARG * 2, Math.round(bas - haut));
      texte(`${P.mode} · ${d.type === 'rig' ? 'marionnette' : d.an + ' ' + (d.i + 1)} · souffle ${Math.round(P.souffle * 100)}`.toUpperCase(), Math.round(cam) + 6, Math.round(camY) + H - 12, '#9fb4c8');
    }
  }

  // ================= Ennemis : placés sur la carte, chacun avec son propre schéma =================
  //   charognard : guette perché, puis fond en piqué sur le dragon, remonte et replonge (trois fois) avant de fuir ;
  //   chauve-souris : dort pendue au plafond, se réveille quand on passe, fonce en zigzag ;
  //   âme errante : tourne en huit autour de son point, sans jamais poursuivre — un obstacle vivant ;
  //   spectre : dérive vers le dragon, s'efface, réapparaît dans son dos (on ne le touche que visible) ;
  //   crâne ardent : tremble en visant, charge en ligne droite, vise de nouveau ; au troisième assaut, il se brise.
  const TYPES = {
    charognard: { pv: 1, r: 13, pts: 100, sprite: 'corbeau', vol: 4, pose: 4 },    // vol : images du battement ; pose : perché
    ame: { pv: 1, r: 12, pts: 80, sprite: 'ame', vol: 4 },
    chauve: { pv: 1, r: 11, pts: 120, sprite: 'chauve', vol: 4, pose: 4 },          // pose : pendue, repliée
    spectre: { pv: 2, r: 14, pts: 200, sprite: 'spectre', vol: 4 },
    crane: { pv: 2, r: 13, pts: 150, sprite: 'crane', vol: 4 },
  };
  const TRAVERSE = { ame: true, spectre: true };        // les âmes et les spectres passent à travers la pierre
  const pierre = (x, y) => bloque(caseA(Math.floor(x / TP), Math.floor(y / TP)));
  function creerEnnemi(type, x, y, dir, diff) {
    const e = { type, x, y, hx: x, hy: y, t: rand(0, 3), ph: rand(0, 6.28), pv: TYPES[type].pv, flash: 0, vx: dir * 30, vy: 0,
                visible: true, alpha: 1, etat: '', et: 0, diff, n: 0, face: dir, image: 0 };
    if (type === 'charognard') {           // se perche sur le sol le plus proche en dessous, sinon plane sur place
      e.etat = 'guet';
      for (let ty = Math.floor(y / TP); ty < Math.floor(y / TP) + 6; ty++) if (bloque(caseA(Math.floor(x / TP), ty)) || caseA(Math.floor(x / TP), ty) === CORNICHE) { e.y = e.hy = ty * TP - 16; e.perche = true; break; }
    } else if (type === 'chauve') {        // cherche un plafond où se pendre
      e.etat = 'vole';
      for (let ty = Math.floor(y / TP); ty > Math.floor(y / TP) - 8; ty--) if (bloque(caseA(Math.floor(x / TP), ty))) { e.y = e.hy = (ty + 1) * TP + 14; e.etat = 'dort'; break; }
      e.chg = 0;
    } else if (type === 'ame') e.etat = 'orbite';
    else if (type === 'spectre') { e.etat = 'visible'; e.et = rand(0, 1); }
    else if (type === 'crane') { e.etat = 'veille'; e.vx = 0; }
    return e;
  }
  function changer(e, etat) { e.etat = etat; e.et = 0; }
  function majEnnemi(e, dt) {
    const ax = e.x, ay = e.y, nb = TYPES[e.type].vol, repos = TYPES[e.type].pose;
    const dx = P.x - e.x, dy = P.y - e.y, dist = Math.hypot(dx, dy), d = e.diff;
    e.t += dt; e.et += dt; e.flash -= dt;
    switch (e.type) {
      case 'charognard':
        if (e.etat === 'guet') {
          e.y = e.hy + (e.perche ? 0 : Math.sin(e.t * 2) * 2); e.image = e.perche ? repos : Math.floor(e.t * 10) % nb; e.face = Math.sign(dx) || 1;
          if (Math.abs(dx) < 160 && Math.abs(dy) < 130) { changer(e, 'envol'); sfx('touche'); }
        } else if (e.etat === 'envol') {   // s'arrache du perchoir
          e.y -= 60 * dt; e.image = Math.floor(e.t * 14) % nb;
          if (e.et > 0.35) { changer(e, 'pique'); e.x0 = e.x; e.y0 = e.y; e.cx = P.x; e.cy = P.y + 6; e.n++; }
        } else if (e.etat === 'pique') {   // un arc en U qui passe par où était le dragon
          const u = Math.min(1, e.et / (1.25 / d)), px = e.x;
          e.x = e.x0 + (e.cx - e.x0) * 2 * u; e.y = e.y0 + (e.cy - e.y0) * Math.sin(Math.PI * u);
          e.face = Math.sign(e.x - px) || e.face; e.image = u < 0.5 ? 2 : Math.floor(e.t * 14) % nb;
          if (u >= 1) changer(e, 'remonte');
        } else if (e.etat === 'remonte') {
          e.x += e.face * 50 * dt; e.y -= 70 * dt; e.image = Math.floor(e.t * 14) % nb;
          if (e.et > 0.7) { if (e.n < 3) { changer(e, 'pique'); e.x0 = e.x; e.y0 = e.y; e.cx = P.x; e.cy = P.y + 6; e.n++; } else changer(e, 'fuite'); }
        } else { e.x += e.face * 90 * dt; e.y -= 30 * dt; e.image = Math.floor(e.t * 14) % nb; }
        break;
      case 'chauve':
        if (e.etat === 'dort') {           // pendue, repliée, la tête en bas
          e.image = repos; e.y = e.hy + Math.sin(e.t * 1.5) * 0.6;
          if (dist < 125) changer(e, 'reveil');
        } else if (e.etat === 'reveil') {
          e.y += 40 * dt; e.image = Math.floor(e.t * 16) % nb;
          if (e.et > 0.3) changer(e, 'vole');
        } else {                            // zigzag vif vers le dragon, cassures franches
          e.chg -= dt;
          if (e.chg <= 0) { e.chg = rand(0.22, 0.4); e.zig = -(e.zig || 1); }
          e.vx = approche(e.vx, Math.sign(dx || 1) * 70 * d, dt * 2);
          e.vy = e.zig * 75 + clamp(dy, -40, 40);
          e.x += e.vx * dt; e.y += e.vy * dt; e.face = Math.sign(e.vx) || 1; e.image = Math.floor(e.t * 16) % nb;
        }
        break;
      case 'ame': {                         // un huit lent autour de son point
        const w = 2 * Math.PI / 5.5 * d;
        const nx = e.hx + 44 * Math.sin(w * e.t + e.ph), ny = e.hy + 20 * Math.sin(2 * (w * e.t + e.ph));
        e.face = Math.sign(nx - e.x) || e.face; e.x = nx; e.y = ny;
        e.image = Math.floor(e.t * 6) % nb; e.alpha = 0.75 + 0.2 * Math.sin(e.t * 9);
        if (Math.random() < 0.25) particule({ x: e.x - e.face * 6 + rand(-2, 2), y: e.y + rand(-3, 3), vx: -e.face * rand(5, 15), vy: rand(-12, -4), vie: 0.5, max: 0.5, t: 1, genre: 'ecto' });
        break;
      }
      case 'spectre':
        e.image = Math.floor(e.t * 6) % nb; e.face = Math.sign(dx) || 1;
        if (e.etat === 'visible') {
          e.visible = true; e.alpha = 0.85;
          e.x += (dx / (dist || 1) * 20 * d) * dt; e.y += (dy / (dist || 1) * 15 * d + Math.sin(e.t * 2) * 6) * dt;
          if (e.et > 2.2) changer(e, 'efface');
        } else if (e.etat === 'efface') {
          e.visible = false; e.alpha = 0.85 * (1 - e.et / 0.4);
          if (e.et > 0.4) changer(e, 'absent');
        } else if (e.etat === 'absent') {
          e.visible = false; e.alpha = 0;
          if (e.et > 0.9) {                 // réapparaît dans le dos du dragon
            for (let k = 0; k < 6; k++) {
              const x = P.x - P.face * rand(60, 95), y = P.y + rand(-24, 16);
              if (!pierre(x, y)) { e.x = x; e.y = y; break; }
            }
            changer(e, 'revient');
          }
        } else {                             // en train de réapparaître : inoffensif, des volutes l'annoncent
          e.visible = false; e.alpha = 0.85 * e.et / 0.5;
          if (Math.random() < 0.6) particule({ x: e.x + rand(-8, 8), y: e.y + rand(-10, 10), vx: rand(-6, 6), vy: rand(-18, -6), vie: 0.5, max: 0.5, t: 1, genre: 'ecto' });
          if (e.et > 0.5) changer(e, 'visible');
        }
        break;
      case 'crane':
        e.image = Math.floor(e.t * 12) % nb;
        if (e.etat === 'veille') {
          e.y = e.hy + Math.sin(e.t * 2.5) * 3;
          if (dist < 175) changer(e, 'vise');
        } else if (e.etat === 'vise') {     // tremble et vise : on le voit venir
          e.face = Math.sign(dx) || e.face;
          e.x += rand(-1, 1); e.y += rand(-1, 1);
          if (Math.random() < 0.7) particule({ x: e.x - e.face * 8, y: e.y + rand(-3, 3), vx: -e.face * rand(20, 50), vy: rand(-20, 5), vie: 0.3, max: 0.3, t: 1 });
          if (e.et > 0.7 / d) { const v = 220 * d; e.vx = dx / (dist || 1) * v; e.vy = dy / (dist || 1) * v; e.n++; changer(e, 'charge'); sfx('ruee'); }
        } else {
          e.x += e.vx * dt; e.y += e.vy * dt; e.face = Math.sign(e.vx) || e.face;
          if (Math.random() < 0.8) particule({ x: e.x - Math.sign(e.vx) * 8, y: e.y + rand(-3, 3), vx: -e.vx * 0.2 + rand(-10, 10), vy: rand(-20, 5), vie: 0.3, max: 0.3, t: 1 });
          if (e.et > 0.75 && e.n < 3) changer(e, 'vise');
        }
        break;
    }
    if (!TRAVERSE[e.type] && pierre(e.x, e.y)) {
      if (e.type === 'crane') { e.mort = true; explosion(e.x, e.y, true); if (e.source) e.source.mort = true; }   // le crâne se brise sur la pierre
      else if (e.type === 'charognard' && e.etat === 'pique') { e.x = ax; e.y = ay; changer(e, 'remonte'); }
      else { e.x = ax; e.y = ay; e.vx = -e.vx; e.zig = -(e.zig || 1); }
    }
    e.y = clamp(e.y, 10, NIV.hauteur - 10);
  }
  function apparitions() {
    if (arene || CALME || P.pv <= 0 || (carte && carte.fondu)) return;
    const diff = 1 + (cycle - 1) * 0.25;
    for (const o of NIV.objets) {
      if (o.genre !== 'ennemi' || o.mort) continue;
      const champ = o.x > cam - 24 && o.x < cam + W + 48 && o.y > camY - 40 && o.y < camY + H + 40;
      if (o.actif === 'parti') { if (!champ) o.actif = false; continue; }   // reviendra quand on repassera
      if (o.actif || !champ) continue;
      o.actif = true;
      const e = creerEnnemi(o.type, o.x, o.y, P.x < o.x ? -1 : 1, diff);
      e.source = o; ennemis.push(e);
    }
  }
  function tuer(e) {
    if (e.source) e.source.mort = true;
    explosion(e.x, e.y, e.type === 'crane' || e.type === 'spectre');
    if (etat !== 'jeu') return;
    combo = temps - dernierKill < 1.4 ? Math.min(combo + 1, 9) : 1;
    dernierKill = temps;
    const pts = TYPES[e.type].pts * combo;
    score += pts; gel = Math.max(gel, 0.04);
    popup('+' + pts, e.x, e.y - 10, combo > 1 ? '#e0c080' : OS);
    if (combo > 1) { popup('COMBO ×' + combo, e.x, e.y - 22, FEU[2]); sfx('combo'); }
    if (P.pv < PV_MAX && Math.random() < (arene ? 0.4 : 0.2)) coeurs.push({ x: e.x, y: e.y, t: 0, sol: solSous(e.x, e.y) });
    noterRecord();
  }
  function noterRecord() { if (score > record) { record = score; try { localStorage.setItem('dragon-rider-record', record); } catch {} } }

  // ---------- le Veilleur, au fond des cryptes ----------
  function entrerArene() {
    arene = true; ennemis = [];
    const V_ = NIV.veilleur, sol = solSous(V_.x, V_.y) ?? NIV.hauteur;
    const y = clamp(sol - SOL, 0, Math.max(0, NIV.hauteur - H));
    NIV.arene = { x: Math.round(V_.x - W * 0.74), y, sol, haut: y + 48 };
    veilleur = { x: V_.x, y: sol + 70, pv: 22, pvMax: 22, t: 0, entree: 0, tir: 3, invoc: 9, flash: 0, machoire: 0, mort: -1, boum: 0 };
    carte = { titre: 'LE VEILLEUR', nom: '', sous: "IL N'A JAMAIS DORMI.", t: 0, fondu: false };
    sfx('veilleur');
  }
  function eventail(v, n, ecart) {
    const bx = v.x - 6, by = v.y + 18, a0 = Math.atan2(P.y - by, P.x - bx);
    for (let i = 0; i < n; i++) {
      const a = a0 + (i - (n - 1) / 2) * ecart / (n - 1);
      orbes.push({ x: bx, y: by, vx: Math.cos(a) * 60, vy: Math.sin(a) * 60, vie: 8 });
    }
    sfx('orbe');
  }
  function blesserVeilleur(v, n) {
    if (v.mort >= 0 || v.entree < 2) return;
    v.pv -= n; v.flash = 0.08; sfx('touche');
    if (v.pv <= 0) {
      v.mort = 0; orbes = []; secousse = 0.6; sfx('veilleur');
      ennemis.forEach((e) => explosion(e.x, e.y, true)); ennemis = [];
      score += 5000 * cycle; popup('+' + 5000 * cycle, v.x, v.y - 40, '#e0c080', 2);
      noterRecord();
    }
  }
  function majVeilleur(dt) {
    const v = veilleur;
    if (!v) return;
    v.t += dt; v.flash -= dt;
    const A = NIV.arene, haut = A.haut + 16, bas = A.sol - 64, milieu = (haut + bas) / 2;
    if (v.mort >= 0) {
      v.mort += dt; v.boum -= dt; v.y += 10 * dt;
      if (v.boum <= 0) { v.boum = 0.12; explosion(v.x + rand(-26, 26), v.y + rand(-22, 26), true); secousse = 0.3; }
      if (v.mort > 2.6) { etat = 'epilogue'; epiT = 0; veilleur = null; }
      return;
    }
    if (v.entree < 2) { v.entree += dt; v.y = approche(v.y, milieu, dt * 1.6); v.machoire = v.entree < 1.6 ? 0.5 + 0.5 * Math.sin(v.t * 9) : 0; return; }
    const rage = v.pv < v.pvMax / 2, diff = 1 + (cycle - 1) * 0.2;
    v.x = A.x + W * (0.74 + 0.07 * Math.sin(v.t * 0.55));
    v.y = milieu + Math.sin(v.t * (rage ? 1.05 : 0.75)) * (bas - haut) * 0.45;
    v.tir -= dt * diff; v.invoc -= dt;
    v.machoire = approche(v.machoire, v.tir < 0.35 ? 1 : 0, dt * 10);
    if (v.tir <= 0) { v.tir = rage ? 2.5 : 3.2; eventail(v, rage ? 6 : 5, rage ? 1.1 : 0.9); }
    if (v.invoc <= 0) {
      v.invoc = rage ? 8 : 10;
      if (ennemis.length < 4) for (const k of [-1, 1]) ennemis.push(Object.assign(creerEnnemi('chauve', v.x - 10, v.y + k * 18, -1, 1), { etat: 'vole', y: v.y + k * 18 }));
    }
    const d = Math.hypot(P.x - v.x, P.y + 4 - v.y);
    if (d < 28 && P.pv > 0) {
      if (P.ruee >= 0) { blesserVeilleur(v, 2); P.ruee = -1; P.vx = -P.face * 250; P.inv = Math.max(P.inv, 0.6); }
      else blesser(v.x);
    }
  }

  // ================= Le monde : ennemis, boules de feu, orbes, cœurs, objets de la carte, particules =================
  function majMonde(dt) {
    apparitions();
    for (const e of ennemis) majEnnemi(e, dt);
    ennemis = ennemis.filter((e) => {
      const loin = Math.abs(e.x - (cam + W / 2)) > W + 220 || Math.abs(e.y - (camY + H / 2)) > H + 160;
      if (loin && e.source && !e.mort) e.source.actif = 'parti';
      return !loin;
    });
    majVeilleur(dt);

    for (const b of boules) {
      b.vie -= dt; b.x += b.vx * dt; b.y += b.vy * dt;
      b.trace.unshift([b.x, b.y]); if (b.trace.length > 7) b.trace.pop();
      if (Math.random() < 0.6) particule({ x: b.x, y: b.y, vx: -b.vx * 0.15 + rand(-20, 20), vy: -b.vy * 0.15 + rand(-25, 25), vie: rand(0.12, 0.3), max: 0.3, t: 1 });
      const mi = [Math.floor((b.x - b.vx * dt / 2) / TP), Math.floor((b.y - b.vy * dt / 2) / TP)];
      const [tx, ty] = bloque(caseA(mi[0], mi[1])) ? mi : [Math.floor(b.x / TP), Math.floor(b.y / TP)], t = caseA(tx, ty);
      if (bloque(t) || b.y > NIV.hauteur) {                  // la pierre arrête le feu ; le mur fissuré cède
        b.vie = 0;
        if (t === FRAGILE) briser(tx, ty);
        explosionSol(b.x - b.vx * 0.012, b.y - b.vy * 0.012);
        continue;
      }
      for (const e of ennemis) {
        if (e.mort || !e.visible || Math.hypot(e.x - b.x, e.y - b.y) > TYPES[e.type].r + 8) continue;
        b.vie = 0; e.pv--; e.flash = 0.08;
        if (e.pv <= 0) { e.mort = true; tuer(e); } else sfx('touche');
        break;
      }
      for (const o of orbes) if (b.vie > 0 && Math.hypot(o.x - b.x, o.y - b.y) < 10) { o.vie = 0; b.vie = 0; explosionSol(o.x, o.y); }
      // le feu touche tout le crâne et la mâchoire
      if (veilleur && b.vie > 0 && ((veilleur.x - b.x) / 34) ** 2 + ((veilleur.y + 8 - b.y) / 44) ** 2 < 1) { b.vie = 0; blesserVeilleur(veilleur, 1); explosionSol(b.x, b.y); }
    }
    boules = boules.filter((b) => b.vie > 0);

    // collisions avec le dragon (zone réduite au corps, plus indulgente que le sprite)
    const hx = P.x + P.face * 6, hy = P.y + 4, fonce = P.ruee >= 0;
    const touche = (x, y, r) => { const dx = (x - hx) / (34 + r), dy = (y - hy) / (12 + r); return dx * dx + dy * dy < 1; };
    for (const e of ennemis) {
      if (e.mort || !e.visible || P.pv <= 0 || !touche(e.x, e.y, TYPES[e.type].r)) continue;
      if (fonce) { e.mort = true; tuer(e); }
      else if (P.inv <= 0) { blesser(e.x); e.mort = true; if (e.source) e.source.mort = true; explosion(e.x, e.y, false); }
    }
    ennemis = ennemis.filter((e) => !e.mort);
    for (const o of orbes) {
      o.vie -= dt; o.x += o.vx * dt; o.y += o.vy * dt;
      if (P.pv > 0 && touche(o.x, o.y, 3) && P.ruee < 0) { o.vie = 0; blesser(o.x); }
    }
    orbes = orbes.filter((o) => o.vie > 0 && o.y > camY - 20 && o.y < camY + H + 10 && Math.abs(o.x - cam - W / 2) < W);
    for (const c of coeurs) {
      c.t += dt; c.y = Math.min((c.sol ?? NIV.hauteur + 60) - 8, c.y + 14 * dt);
      if (P.pv > 0 && Math.hypot(c.x - P.x, c.y - P.y - 4) < 24) { c.pris = true; P.pv = Math.min(PV_MAX, P.pv + 1); popup('VIE +1', c.x, c.y - 10, '#e0505a'); sfx('soin'); }
    }
    coeurs = coeurs.filter((c) => !c.pris && c.t < 9);
    if (etat === 'jeu' && P.pv > 0) ramasser();

    for (const p of particules) {
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.genre === 'plume' || p.genre === 'os' || p.genre === 'gravat') { p.vy += 200 * dt; p.vx *= 0.97; p.rot += dt * 7; }
      else if (p.genre === 'poussiere') { p.vx *= 0.9; p.vy *= 0.92; }
      else { p.vx *= 0.93; p.vy *= 0.93; }
    }
    particules = particules.filter((p) => p.vie > 0);
    for (const o of ombres) o.vie -= dt;
    ombres = ombres.filter((o) => o.vie > 0);
    for (const p of popups) { p.vie -= dt; p.y -= 22 * dt; }
    popups = popups.filter((p) => p.vie > 0);
  }
  // reliques, cœurs posés sur la carte, autels (on y reprendra après une chute)
  function ramasser() {
    const hx = P.x + P.face * 6, hy = P.y + 4;
    for (const o of NIV.objets) {
      if (o.genre === 'relique' || o.genre === 'coeur') {
        if (o.pris || ((o.x - hx) / 42) ** 2 + ((o.y - hy) / 26) ** 2 > 1) continue;   // au contact du corps, du cou ou de la tête
        o.pris = true;
        if (o.genre === 'coeur') { P.pv = Math.min(PV_MAX, P.pv + 1); popup('VIE +1', o.x, o.y - 10, '#e0505a'); sfx('soin'); continue; }
        NIV.prises++; score += 500 * cycle; noterRecord();
        popup('RELIQUE ' + NIV.prises + '/' + NIV.reliques, o.x, o.y - 12, '#e0c080');
        for (let i = 0; i < 10; i++) particule({ x: o.x, y: o.y, vx: rand(-60, 60), vy: rand(-80, 10), vie: rand(0.3, 0.6), max: 0.6, t: 1, genre: 'ecto' });
        sfx('combo');
      } else if (o.genre === 'autel' && !o.allume && auSol() && Math.abs(o.x - P.x) < 26 && Math.abs(o.y - P.sol) < 6) {
        NIV.objets.forEach((a) => { if (a.genre === 'autel') a.allume = false; });
        o.allume = true; NIV.reprise = [o.x, o.y];
        P.pv = PV_MAX; P.souffle = 1;
        popup("L'AUTEL S'ALLUME", o.x, o.y - 40, FEU[1]); sfx('soin'); sfx('glas', 0.1);
      }
    }
  }
  function explosionSol(x, y) {
    particule({ x, y, vie: 0.25, max: 0.25, genre: 'onde' });
    for (let i = 0; i < 8; i++) particule({ x, y: y + 1, vx: rand(-70, 70), vy: rand(-90, -20), vie: rand(0.2, 0.45), max: 0.45, t: Math.floor(rand(1, 3)) });
  }

  // ---------- dessin des ennemis, du Veilleur et des effets (coordonnées du monde) ----------
  const COEUR = ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'];
  function coeur(x, y, plein) {            // blanc d'os cerclé de noir (vide : un creux sombre)
    ctx.fillStyle = '#060606';

  // ================= Interface (dessinée dans l'image, en police pixel) =================

  function hud() {

  // ================= Écran titre : un menu (COMMENCER, COMMANDES) et l'écran des commandes =================

  function touche(label, x, y) {                            // une touche de clavier dessinée, renvoie sa largeur

  function panne(l1, l2) {
    disposer();
    ctx.fillStyle = ENCRE; ctx.fillRect(0, 0, W, H);
    texte(l1, W / 2, H / 2 - 6, SANG_VIF, 1, 'ombre', 'centre');
    texte(l2, W / 2, H / 2 + 8, OS, 1, 'ombre', 'centre');
  }
  const charger = (src) => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; });
  const demarrerJeu = (img, imgPlanche) => {
    disposer();
    PIECES = construirePieces(img);
    PL = construirePlanche(imgPlanche);
    HALOS = [construireHalo(14, 1), construireHalo(16, 2)];
    TUILES = construireTuiles(); ACCESSOIRES = construireAccessoires();
    construireEnnemis();
    modeTitre();
    requestAnimationFrame((t) => { avant = t; requestAnimationFrame(boucle); });
  };
  if (!NIVEAUX || NIVEAUX.length < 3) panne('NIVEAUX INTROUVABLES', 'RECONSTRUIRE : OUTILS/CONSTRUIRE_JEU.PY');
  else if (!ART || PLANS.some((a) => a.plans.some((p) => !ART[p.el]))) panne('DÉCORS INTROUVABLES', 'RECONSTRUIRE : OUTILS/CONSTRUIRE_JEU.PY');
  else Promise.all([charger(ATLAS), charger(PLANCHE), ...Object.entries(ART).map(([k, a]) => charger(a.src).then((i) => { IMAGES_ART[k] = i; }))])
    .then(([img, imgPlanche]) => demarrerJeu(img, imgPlanche))
    .catch(() => panne('IMAGES DU JEU ILLISIBLES', 'RECONSTRUIRE : OUTILS/CONSTRUIRE_JEU.PY'));
})();
</script>
