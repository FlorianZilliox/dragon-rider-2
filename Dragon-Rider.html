<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dragon Rider</title>
<style>
  /* Un seul monde visuel : un crépuscule gothique en 16 bits. Pas de variante claire/sombre. */
  [hidden] { display: none !important; }
  :root {
    --fond: #070707;
    --croix: #1d1d1d;
    --croix-creux: #131313;
    --sang: #8e2230;
    --bronze: #7d7d7d;
    --panneau: #232323;
    --panneau-ombre: #181818;
    --etiquette: #818181;
    --b: clamp(44px, 8vmin, 60px);
  }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--fond);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    font-family: ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
  }
  #jeu {
    position: fixed; inset: 0; touch-action: none; background: var(--fond);
    display: flex; align-items: center; justify-content: center;
  }
  #jeu.portrait { flex-direction: column; justify-content: flex-start; padding-top: env(safe-area-inset-top, 0px); }
  #ecran { display: block; flex: none; image-rendering: pixelated; image-rendering: crisp-edges; }

  .manette {
    position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none;
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(16px, env(safe-area-inset-left, 0px));
  }
  #jeu.paysage .manette { opacity: .72; }
  #jeu.portrait .manette {
    position: relative; flex: 1; align-items: center; width: 100%; box-sizing: border-box;
    background: linear-gradient(var(--panneau), var(--panneau-ombre));
    border-top: 3px solid #373737; padding-top: 10px;
  }
  .croix {
    pointer-events: auto; display: grid;
    grid-template-columns: repeat(3, var(--b)); grid-template-rows: repeat(3, var(--b));
    grid-template-areas: ". haut ." "gauche moyeu droite" ". bas .";
    filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .45));
  }
  .croix button, .moyeu { background: var(--croix); border: 0; padding: 0; }
  .croix button {
    -webkit-tap-highlight-color: transparent; touch-action: none; cursor: pointer;
    color: #6a6a6a; display: grid; place-items: center;
  }
  .croix button svg { width: 38%; height: 38%; fill: currentColor; }
  .croix button.on { background: var(--croix-creux); color: #adadad; }
  #btn-haut { grid-area: haut; border-radius: 7px 7px 0 0; }
  #btn-bas { grid-area: bas; border-radius: 0 0 7px 7px; }
  #btn-gauche { grid-area: gauche; border-radius: 7px 0 0 7px; }
  #btn-droite { grid-area: droite; border-radius: 0 7px 7px 0; }
  .moyeu { grid-area: moyeu; display: grid; place-items: center; }
  .moyeu::after { content: ""; width: 42%; height: 42%; border-radius: 50%; background: var(--croix-creux); }

  .actions { pointer-events: auto; display: flex; gap: 14px; align-items: flex-start; }
  .action { display: grid; justify-items: center; gap: 5px; }
  .action:first-child { margin-top: calc(var(--b) * .55); }
  .rond {
    -webkit-tap-highlight-color: transparent; touch-action: none; cursor: pointer;
    width: calc(var(--b) * 1.3); height: calc(var(--b) * 1.3); border-radius: 50%; border: 0; padding: 0;
    font-family: inherit; font-weight: 800; font-size: calc(var(--b) * .38); line-height: 1;
    box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .28), 0 3px 0 rgba(0, 0, 0, .5);
    transition: transform .06s;
  }
  .rond.on { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .28), 0 1px 0 rgba(0, 0, 0, .5); }
  #btn-ruee { background: var(--bronze); color: #1c1c1c; }
  #btn-feu { background: var(--sang); color: #e7e7e7; }
  .action span { font-size: 11px; font-weight: 800; letter-spacing: .12em; color: #c7c7c7; text-shadow: 0 1px 0 #000; }
  #jeu.portrait .action span { color: var(--etiquette); text-shadow: none; }
  button:focus-visible { outline: 2px solid #d1d1d1; outline-offset: 2px; }
</style>

<div id="jeu" class="paysage">
  <canvas id="ecran" aria-label="Dragon Rider : un dragonnier traverse un monde éteint, des terres décharnées jusqu'aux cryptes"></canvas>
  <div class="manette">
    <div class="croix" aria-label="Croix directionnelle">
      <button type="button" id="btn-haut" data-k="up" aria-label="Monter"><svg viewBox="0 0 10 10"><path d="M5 1 9.5 8h-9z"/></svg></button>
      <button type="button" id="btn-gauche" data-k="left" aria-label="Gauche"><svg viewBox="0 0 10 10"><path d="M1 5 8 .5v9z"/></svg></button>
      <div class="moyeu"></div>
      <button type="button" id="btn-droite" data-k="right" aria-label="Droite"><svg viewBox="0 0 10 10"><path d="M9 5 2 .5v9z"/></svg></button>
      <button type="button" id="btn-bas" data-k="down" aria-label="Descendre"><svg viewBox="0 0 10 10"><path d="M5 9 9.5 2h-9z"/></svg></button>
    </div>
    <div class="actions">
      <div class="action"><button type="button" class="rond" id="btn-ruee" data-k="ruee" aria-label="Ruée (touche C)">C</button><span>RUÉE</span></div>
      <div class="action"><button type="button" class="rond" id="btn-feu" data-k="fire" aria-label="Feu (touche X ou Espace)">X</button><span>FEU</span></div>
    </div>
  </div>
</div>

    const tour = Math.sin(Math.PI * clamp((1 - d.fs * P.face) / 2, 0, 1));
    d.tourne = Math.sign(d.fs) !== P.face && Math.abs(d.fs) < 0.65;   // le corps n'a pas fini de tourner, la tête si

    ctx.scale(largeurDemiTour(d.fs), 1 + (auSolPose ? 0.02 : 0.08) * tour);
    if (d.pitch || tour) ctx.rotate((d.pitch || 0) - (auSolPose ? 0.08 : 0.3) * tour);
    ctx.translate(Math.round(d.corps.dx), Math.round(d.corps.dy));

  // ================= Ennemis : placés sur la carte, chacun avec son propre schéma =================

  const TYPES = {

    ame: { pv: 1, r: 12, pts: 80, sprite: 'ame', vol: 6 },

  const TRAVERSE = { ame: true, spectre: true };        // les âmes et les spectres passent à travers la pierre
  const pierre = (x, y) => bloque(caseA(Math.floor(x / TP), Math.floor(y / TP)));
  function creerEnnemi(type, x, y, dir, diff) {
    const e = { type, x, y, hx: x, hy: y, t: rand(0, 3), ph: rand(0, 6.28), pv: TYPES[type].pv, flash: 0, vx: dir * 30, vy: 0,

  function majVeilleur(dt) {

    if (v.tir <= 0) { v.tir = rage ? 2.5 : 3.2; eventail(v, rage ? 6 : 5, rage ? 1.1 : 0.9); }

  // ================= Le monde : ennemis, boules de feu, orbes, cœurs, objets de la carte, particules =================
  function majMonde(dt) {
    apparitions();
    for (const e of ennemis) majEnnemi(e, dt);
    ennemis = ennemis.filter((e) => {
      const loin = Math.abs(e.x - (cam + W / 2)) > W + 220 || Math.abs(e.y - (camY + H / 2)) > H + 160;
      if (loin && e.source && !e.mort) e.source.actif = 'parti';
      return !loin;
    });
    majVeilleur(dt);

    for (const b of boules) {
      b.vie -= dt; b.x += b.vx * dt; b.y += b.vy * dt;
      b.trace.unshift([b.x, b.y]); if (b.trace.length > 7) b.trace.pop();
      if (Math.random() < 0.6) particule({ x: b.x, y: b.y, vx: -b.vx * 0.15 + rand(-20, 20), vy: -b.vy * 0.15 + rand(-25, 25), vie: rand(0.12, 0.3), max: 0.3, t: 1 });
      const mi = [Math.floor((b.x - b.vx * dt / 2) / TP), Math.floor((b.y - b.vy * dt / 2) / TP)];
      const [tx, ty] = bloque(caseA(mi[0], mi[1])) ? mi : [Math.floor(b.x / TP), Math.floor(b.y / TP)], t = caseA(tx, ty);
      if (bloque(t) || b.y > NIV.hauteur) {                  // la pierre arrête le feu ; le mur fissuré cède
        b.vie = 0;
        if (t === FRAGILE) briser(tx, ty);
        explosionSol(b.x - b.vx * 0.012, b.y - b.vy * 0.012);
        continue;
      }
      for (const e of ennemis) {
        if (e.mort || !e.visible || Math.hypot(e.x - b.x, e.y - b.y) > TYPES[e.type].r + 8) continue;
        b.vie = 0; e.pv--; e.flash = 0.08;
        if (e.pv <= 0) { e.mort = true; tuer(e); } else sfx('touche');
        break;
      }
      for (const o of orbes) if (b.vie > 0 && Math.hypot(o.x - b.x, o.y - b.y) < 10) { o.vie = 0; b.vie = 0; explosionSol(o.x, o.y); }
      // le feu touche tout le crâne et la mâchoire
      if (veilleur && b.vie > 0 && ((veilleur.x - b.x) / 34) ** 2 + ((veilleur.y + 8 - b.y) / 44) ** 2 < 1) { b.vie = 0; blesserVeilleur(veilleur, 1); explosionSol(b.x, b.y); }
    }
    boules = boules.filter((b) => b.vie > 0);

    // collisions avec le dragon (zone réduite au corps, plus indulgente que le sprite)
    const hx = P.x + P.face * 6, hy = P.y + 4, fonce = P.ruee >= 0;
    const touche = (x, y, r) => { const dx = (x - hx) / (34 + r), dy = (y - hy) / (12 + r); return dx * dx + dy * dy < 1; };
    for (const e of ennemis) {
      if (e.mort || !e.visible || P.pv <= 0 || !touche(e.x, e.y, TYPES[e.type].r)) continue;
      if (fonce) { e.mort = true; tuer(e); }
      else if (P.inv <= 0) { blesser(e.x); e.mort = true; if (e.source) e.source.mort = true; explosion(e.x, e.y, false); }
    }
    ennemis = ennemis.filter((e) => !e.mort);
    for (const o of orbes) {
      o.vie -= dt; o.x += o.vx * dt; o.y += o.vy * dt;
      if (P.pv > 0 && touche(o.x, o.y, 3) && P.ruee < 0) { o.vie = 0; blesser(o.x); }
    }
    orbes = orbes.filter((o) => o.vie > 0 && o.y > camY - 20 && o.y < camY + H + 10 && Math.abs(o.x - cam - W / 2) < W);
    for (const c of coeurs) {

    }
    coeurs = coeurs.filter((c) => !c.pris && c.t < 9);
    if (etat === 'jeu' && P.pv > 0) ramasser();

    for (const p of particules) {
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.genre === 'plume' || p.genre === 'os' || p.genre === 'gravat') { p.vy += 200 * dt; p.vx *= 0.97; p.rot += dt * 7; }

  // reliques, cœurs posés sur la carte, autels (on y reprendra après une chute)

  // ---------- dessin des ennemis, du Veilleur et des effets (coordonnées du monde) ----------

    voile(0.6);
    const grand = W >= 270 && H >= 196, c = IMAGES_ART[grand ? 'objets/cadre' : 'objets/cadre-petit'];
    const x0 = Math.round(W / 2 - c.width / 2), y0 = Math.round(H / 2 - c.height / 2), o = ouverture(c);
    ctx.globalAlpha = 0.88; ctx.fillStyle = '#0a0a0a'; ctx.fillRect(x0 + o.x0 - 2, y0 + o.y0 - 2, o.x1 - o.x0 + 5, o.y1 - o.y0 + 5); ctx.globalAlpha = 1;
    ctx.drawImage(c, x0, y0);
    const cx = Math.round(W / 2);
    texte('COMMANDES', cx, y0 + o.y0 - 12, OS, 1, 'contour', 'centre');
    const lignes = [
      [['←', '→'], grand ? 'VOLER, MARCHER' : 'VOLER'],
      [['↑'], grand ? 'MONTER, SAUTER' : 'MONTER'],
      [['↓'], 'PIQUER'],
      [['X'], grand ? 'FEU (TENIR : RAFALE)' : 'FEU'],
      [['C'], grand ? 'RUÉE, BRISE LES MURS' : 'RUÉE'],
      [['↓', 'C'], 'PIQUÉ'],
    ];
    const col = grand ? 56 : 46, larg = col + (grand ? 20 : 6) * 6, gauche = cx - (larg >> 1), pas = grand ? 13 : 12;
    let yy = y0 + o.y0 + 4;
    for (const [ts, action] of lignes) {
      let x = gauche;
      ts.forEach((t, i) => {
        if (i && action === 'PIQUÉ') { texte('+', x + 2, yy + 2, OS2, 1, 'plat'); x += 10; }   // ↓ + C : ensemble
        else if (i) x += 3;                                                                   // ← → : l'un ou l'autre
        x += touche(t, x, yy);
      });
      texte(action, gauche + col, yy + 2, OS2, 1, 'ombre');
      yy += pas;
    }
    if (grand) {
      texte('VOLER USE LE SOUFFLE,', cx, yy + 3, '#9d9c97', 1, 'ombre', 'centre');
      texte('LE SOL ET LA CENDRE LE RENDENT.', cx, yy + 12, '#9d9c97', 1, 'ombre', 'centre');
    }
    const bas = y0 + c.height + 6;                             // sous le cadre s'il y a la place, sinon dans l'ouverture
    if (Math.floor(temps * 2) % 2) texte('X : RETOUR', cx, bas + 8 < H ? bas : y0 + o.y1 - 8, OS, 1, 'contour', 'centre');
  }


  function ecranFin(dt) {
    finT += dt;
    ctx.fillStyle = 'rgba(7,6,11,0.55)'; ctx.fillRect(0, 0, W, H);
    const y = Math.round(H * 0.3);
    texte('LE DRAGONNIER EST TOMBÉ', W / 2, y, LOGO, W >= 290 ? 2 : 1, 'contour', 'centre');
    texte('SCORE ' + pad(score, 6) + '   RECORD ' + pad(record, 6), W / 2, y + 30, OS2, 1, 'ombre', 'centre');
    if (Math.floor(temps * 2) % 2) texte(NIV.reprise ? "FEU : REPRENDRE À L'AUTEL" : "FEU : REPRENDRE L'ACTE " + ACTES[acte].num, W / 2, y + 50, OS, 1, 'contour', 'centre');
  }
  function ecranEpilogue() {
    ctx.fillStyle = ENCRE; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 40; i++) { const x = Math.floor(hash(i * 3.3) * W), y = Math.floor(hash(i * 5.1) * H); if (Math.sin(temps + i) > 0.3) { ctx.fillStyle = '#292929'; ctx.fillRect(x, y, 1, 1); } }
    EPILOGUE.forEach((l, i) => { if (epiT > 0.8 + i * 1.5) texte(l, W / 2, Math.round(H * 0.24) + i * 16, i === 3 ? OS : BRUME, 1, 'ombre', 'centre'); });
    if (epiT > 7) {
      texte('SCORE ' + pad(score, 6) + '   RECORD ' + pad(record, 6), W / 2, Math.round(H * 0.24) + 82, OS2, 1, 'ombre', 'centre');
      if (Math.floor(temps * 2) % 2) texte('FEU : UN NOUVEAU CYCLE', W / 2, Math.round(H * 0.24) + 100, OS, 1, 'contour', 'centre');
    }
  }

  // ================= Démo de l'écran titre : le dragon patrouille au-dessus du premier gouffre =================
  let demoAvant = 0, demoDir = 1;
  function entreesDemo() {
    if (P.x > 600) demoDir = -1; else if (P.x < 140) demoDir = 1;
    const E = { L: demoDir < 0, R: demoDir > 0, U: false, D: false, feu: false, appuis: new Set(), gestes: new Set() };
    const c0 = demoAvant % 7, c1 = temps % 7;
    demoAvant = temps;
    const passe = (t) => c0 < t && c1 >= t;
    const ys = P.y - camY;                                   // altitude à l'écran, sous le titre
    E.U = ys > 128 || (c1 > 1 && c1 < 1.6);
    E.D = ys < 88 && !E.U;
    if (passe(0.5) || passe(2.2) || passe(4.6) || passe(6.3)) E.appuis.add('fire');
    if (passe(5.5)) E.appuis.add('ruee');
    return E;
  }

  // ================= Caméra : suit le dragon dans les deux directions, se fige dans l'arène =================
  function suivreCamera(dt) {
    if (arene && NIV.arene) { cam = approche(cam, NIV.arene.x, dt * 3); camY = approche(camY, NIV.arene.y, dt * 3); return; }
    cam = clamp(approche(cam, P.x - W * 0.38 + P.face * W * 0.08, dt * 3), 0, Math.max(0, NIV.largeur - W));
    let cible;
    if (etat === 'titre') cible = NIV.depart[1] - SOL;
    else if (P.mode === 'ground' || P.mode === 'land' || P.mode === 'dead') cible = P.sol - SOL;   // au sol : le sol à sa place habituelle
    else cible = clamp(camY, P.y - H * 0.74, P.y - H * 0.3);
    camY = clamp(approche(camY, cible, dt * 4), 0, Math.max(0, NIV.hauteur - H));
  }

  // ================= Boucle =================
  let avant = 0;
  function boucle(tms) {
    const dt = Math.min(0.05, (tms - avant) / 1000 || 0);
    avant = tms;
    temps += dt;
    if (etat === 'epilogue') {
      epiT += dt;
      if (epiT > 7 && appuis.has('fire')) nouveauCycle();
      appuis = new Set(); gestes = new Set();
      if (etat === 'epilogue') { ecranEpilogue(); requestAnimationFrame(boucle); return; }
    }
    const E = etat === 'titre' ? entreesDemo()
      : { L: tenu('left'), R: tenu('right'), U: tenu('up'), D: tenu('down'), feu: tenu('fire'), appuis, gestes };
    tenuBas = E.D;
    if (etat === 'titre' && pageTitre === 'commandes' && (appuis.has('fire') || appuis.has('ruee'))) { pageTitre = 'menu'; sfx('touche'); }
    else if (etat === 'titre' && (appuis.has('up') || appuis.has('down'))) { choix = (choix + (appuis.has('up') ? MENU.length - 1 : 1)) % MENU.length; sfx('touche'); }
    else if (etat === 'titre' && (appuis.has('fire') || appuis.has('ruee'))) { if (choix === 0) nouvellePartie(); else { pageTitre = 'commandes'; sfx('touche'); } }
    else if (etat === 'fin' && finT > 0.8 && appuis.has('fire')) reprendre();
    else if (gel > 0) gel -= dt;                                   // micro-pause à l'impact
    else {
      if (etat === 'titre') { P.pv = PV_MAX; P.souffle = 1; }
      majCarte(dt);
      majDragon(dt, E);
      if (etat === 'jeu') progression();
      majMonde(dt);
      majMeteo(dt);
      suivreCamera(dt);
    }
    appuis = new Set(); gestes = new Set();
    secousse = Math.max(0, secousse - dt);

    ctx.save();
    if (secousse > 0 && !reduit) ctx.translate(Math.round(rand(-2, 2) * secousse * 5), Math.round(rand(-2, 2) * secousse * 5));
    decor();
    ctx.save();
    ctx.translate(-Math.round(cam), -Math.round(camY));          // le monde, en coordonnées de la carte
    dessinerCourants();
    dessinerTuiles();
    dessinerObjets();
    dessinerEnnemis();
    dessinerDragon();
    dessinerEffets();
    ctx.restore();
    dessinerMeteo();
    ctx.restore();
    if (etat === 'titre') ecranTitre();
    else { hud(); dessinerCarte(); if (etat === 'fin') ecranFin(dt); }
    if (etat === 'epilogue') ecranEpilogue();
    requestAnimationFrame(boucle);
  }

  // lecture seule, pour les tests automatisés (outils de vérification)
  window.__dragonRider = () => {
    return { etat, acte: acte + 1, decor: acteVisuel + 1, arene, veilleur: veilleur ? veilleur.pv : null, veilleurY: veilleur ? Math.round(veilleur.y) : null, mode: P.mode,
             pv: P.pv, score, ennemis: ennemis.length, x: Math.round(P.x), y: Math.round(P.y), sol: P.sol, souffle: +P.souffle.toFixed(2),
             sx: Math.round(P.x - cam), sy: Math.round(P.y - camY), cam: Math.round(cam), camY: Math.round(camY),
             reliques: NIV.prises + '/' + NIV.reliques, reprise: NIV.reprise, largeur: NIV.largeur, rueeDispo: P.rueeDispo, ruee: P.ruee,
             visuel: (() => { const d = posture(); return d.type === 'rig' ? 'marionnette' : d.an + ' ' + (d.i + 1); })() };
  };
  // #essai : poser le dragon où l'on veut pour tester un passage (outils de vérification)
  if (ESSAI) window.__essai = {
    poser(tx, ty) { P.x = tx * TP + TP / 2; P.sol = (ty + 1) * TP; P.mode = 'ground'; P.at = 0; P.vx = P.vy = 0; P.y = P.sol - G; P.dernierSol = [P.x, P.sol]; cadrer(); },
    voler(tx, ty) { P.x = tx * TP + TP / 2; P.y = ty * TP + TP / 2; P.mode = 'air'; P.vx = P.vy = 0; cadrer(); },
    niveau: () => ({ l: NIV.l, h: NIV.h, objets: NIV.objets.length, reliques: NIV.reliques }),
    souffle(v) { P.souffle = v; },
    pv(n) { P.pv = n; },
    caseA: (tx, ty) => caseA(tx, ty),
    objets: () => NIV.objets.filter((o) => o.genre !== 'decor').map((o) => `${o.genre}${o.type ? '/' + o.type : ''}@${Math.floor(o.x / TP)},${Math.floor(o.y / TP)}${o.pris ? ' pris' : ''}${o.allume ? ' allumé' : ''}${o.mort ? ' mort' : ''}`),
  };

  function panne(l1, l2) {
    disposer();
    ctx.fillStyle = ENCRE; ctx.fillRect(0, 0, W, H);
    texte(l1, W / 2, H / 2 - 6, SANG_VIF, 1, 'ombre', 'centre');
    texte(l2, W / 2, H / 2 + 8, OS, 1, 'ombre', 'centre');
  }
  const charger = (src) => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; });
  const demarrerJeu = (img, imgPlanche) => {
    disposer();
    PIECES = construirePieces(img);
    PL = construirePlanche(imgPlanche);
    HALOS = [construireHalo(14, 1), construireHalo(16, 2)];
    TUILES = construireTuiles(); ACCESSOIRES = construireAccessoires();
    construireEnnemis();
    modeTitre();
    requestAnimationFrame((t) => { avant = t; requestAnimationFrame(boucle); });
  };
  if (!NIVEAUX || NIVEAUX.length < 3) panne('NIVEAUX INTROUVABLES', 'RECONSTRUIRE : OUTILS/CONSTRUIRE_JEU.PY');
  else if (!ART || PLANS.some((a) => a.plans.some((p) => !ART[p.el]))) panne('DÉCORS INTROUVABLES', 'RECONSTRUIRE : OUTILS/CONSTRUIRE_JEU.PY');
  else Promise.all([charger(ATLAS), charger(PLANCHE), ...Object.entries(ART).map(([k, a]) => charger(a.src).then((i) => { IMAGES_ART[k] = i; }))])
    .then(([img, imgPlanche]) => demarrerJeu(img, imgPlanche))
    .catch(() => panne('IMAGES DU JEU ILLISIBLES', 'RECONSTRUIRE : OUTILS/CONSTRUIRE_JEU.PY'));
})();
</script>
